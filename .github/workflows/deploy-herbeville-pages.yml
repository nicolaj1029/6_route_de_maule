name: Deploy Herbeville Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-herbeville-pages.yml'
      - 'public/models/herbeville/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: herbeville-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/models/herbeville/package-lock.json

      - name: Install dependencies
        working-directory: public/models/herbeville
        run: npm ci

      - name: Build GitHub Pages bundle
        working-directory: public/models/herbeville
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/models/herbeville/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
